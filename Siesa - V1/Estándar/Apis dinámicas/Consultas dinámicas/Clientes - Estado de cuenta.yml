info:
  name: Clientes - Estado de cuenta
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url_qa}}/api/v3/ejecutarconsulta?idCompania={{idCompania}}&descripcion=AE_Terceros&parametros=FechaIni=2009-01-01|FechaFin=2024-10-10|NitTercero=|IdSucursal="
  headers:
    - name: conniKey
      value: "{{conniKey}}"
    - name: conniToken
      value: "{{conniToken}}"
  params:
    - name: idCompania
      value: "{{idCompania}}"
      type: query
    - name: descripcion
      value: AE_Terceros
      type: query
    - name: parametros
      value: FechaIni=2009-01-01|FechaFin=2024-10-10|NitTercero=|IdSucursal=
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

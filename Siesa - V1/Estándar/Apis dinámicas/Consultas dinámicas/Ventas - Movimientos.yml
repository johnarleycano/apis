info:
  name: Ventas - Movimientos
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url_produccion}}/api/v3/ejecutarconsulta?idCompania={{idCompania}}&descripcion=Movimiento_ventas&parametros=rowid_docto=|fecha=2024-11-20|tamPag=500|numPag=1"
  headers:
    - name: conniKey
      value: "{{conniKey}}"
    - name: conniToken
      value: "{{conniToken}}"
  params:
    - name: idCompania
      value: "{{idCompania}}"
      type: query
    - name: descripcion
      value: Movimiento_ventas
      type: query
    - name: parametros
      value: rowid_docto=|fecha=2024-11-20|tamPag=500|numPag=1
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

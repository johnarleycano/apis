info:
  name: Inventarios
  type: http
  seq: 2

http:
  method: GET
  url: '{{base_url_qa}}/api/v3/ejecutarconsulta?idCompania={{idCompania}}&descripcion=Inventarios&paginacion=numPag=1|tamPag=100&parametros=f200_id="-1"|f353_consec_docto_cruce="-1"'
  headers:
    - name: conniKey
      value: "{{conniKey}}"
    - name: conniToken
      value: "{{conniToken}}"
  params:
    - name: idCompania
      value: "{{idCompania}}"
      type: query
    - name: descripcion
      value: Inventarios
      type: query
    - name: paginacion
      value: numPag=1|tamPag=100
      type: query
    - name: parametros
      value: f200_id="-1"|f353_consec_docto_cruce="-1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

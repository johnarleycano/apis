info:
  name: Precios
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url_qa}}/api/v3/ejecutarconsulta?idCompania={{idCompania}}&descripcion=Precios&paginacion=numPag=1|tamPag=100"
  headers:
    - name: conniKey
      value: "{{conniKey}}"
    - name: conniToken
      value: "{{conniToken}}"
  params:
    - name: idCompania
      value: "{{idCompania}}"
      type: query
    - name: descripcion
      value: Precios
      type: query
    - name: paginacion
      value: numPag=1|tamPag=100
      type: query
    - name: parametros
      value: Lista_precio="002"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

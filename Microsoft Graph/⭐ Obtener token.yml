info:
  name: ⭐ Obtener token
  type: http
  seq: 1

http:
  method: POST
  url: https://login.microsoftonline.com/{{ecommerce_MicrosoftTenantId}}/oauth2/v2.0/token
  body:
    type: multipart-form
    data:
      - name: client_id
        type: text
        value: "{{ecommerce_MicrosoftClientId}}"
      - name: client_secret
        type: text
        value: "{{ecommerce_MicrosoftClientSecret}}"
      - name: grant_type
        type: text
        value: client_credentials
      - name: scope
        type: text
        value: https://graph.microsoft.com/.default
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
